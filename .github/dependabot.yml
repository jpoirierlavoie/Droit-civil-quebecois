version: 2
updates:
  # Dépôt sans gestionnaire de paquets JS/Python : uniquement la maintenance des actions GitHub.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "06:00"
      timezone: "America/Montreal"
    open-pull-requests-limit: 5
    assignees:
      - "jpoirierlavoie"
    commit-message:
      prefix: "ci"
      include: "scope"
    labels:
      - "dependencies"
      - "github-actions"
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
