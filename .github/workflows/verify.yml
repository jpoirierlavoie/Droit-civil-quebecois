name: Vérification

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Contrôle des compétences et manifestes
        run: |
          sortie="$(python verifier.py --release 2>&1)"
          if [ -n "$sortie" ]; then
            echo "$sortie" >&2
            exit 1
          fi
      - name: Auto-test de la suite d'évaluation
        run: python evals/executer_evals.py --auto-test
      - name: Vérification E2E multi-paliers (mock)
        run: python verifier_tout.py --mode mock
      - name: Validation du paquet Claude Directory
        run: |
          python scripts/empaqueter_plugin_claude.py
          python scripts/empaqueter_plugin_claude.py --apply
