name: Vérification

on:
  push:
    branches: [main, v3.0]
  pull_request:

permissions:
  contents: read

jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Contrôle des compétences et manifestes
        run: |
          sortie="$(python verifier.py 2>&1)"
          if [ -n "$sortie" ]; then
            echo "$sortie" >&2
            exit 1
          fi
      - name: Auto-test de la suite d'évaluation
        run: python evals/executer_evals.py --auto-test
      - name: Vérification E2E multi-paliers (mock)
        run: python verifier_tout.py --mode mock
