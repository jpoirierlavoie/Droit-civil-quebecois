name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Checkout tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Vérifier l'étiquette et les invariants de publication
        env:
          TAG: ${{ github.ref_name }}
          PYTHONUTF8: "1"
        run: |
          set -euo pipefail
          manifest_version="$(python -c 'import json; print(json.load(open(".claude-plugin/plugin.json", encoding="utf-8"))["version"])')"
          if [ "$TAG" != "v${manifest_version}" ]; then
            echo "Tag ${TAG} ne correspond pas à la version des manifestes (v${manifest_version})." >&2
            exit 1
          fi
          sortie="$(python verifier.py --release 2>&1)"
          if [ -n "$sortie" ]; then
            echo "$sortie" >&2
            exit 1
          fi
          python evals/executer_evals.py --auto-test
          python verifier_tout.py --mode mock
          python scripts/empaqueter_plugin_claude.py --apply

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists."
            exit 0
          fi
          gh release create "$TAG" --repo "$REPO" --verify-tag --generate-notes
